<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="../style.css"> -->
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="icon" href="../assets/images/logoBL.svg" type="image/x-icon">
    <title>SoundWave — Каталог</title>
</head>

<body>
    <header class="header">
        <a href="../index.html" class="logo">
            <img src="../assets/images/logoBL.svg" alt="logo SoundWave">
            SoundWave
        </a>
        <nav class="header-nav">
            <a href="../index.html">Главная</a>
            <a href="../pages/catalog.html">Каталог</a>
            <a href="#">Исполнители</a>
            <a href="#">Профиль</a>
        </nav>
    </header>

    <main class="form-page">
        <form id="loginForm" class="auth-form" novalidate>
            <h1>Вход</h1>

            <div class="form-group">
                <label for="loginEmail">Email или логин</label>
                <input type="text" id="loginEmail" name="loginEmail" required>
                <span class="error" data-error="loginEmail"></span>
            </div>

            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <div class="password-wrap">
                    <input type="password" id="loginPassword" name="loginPassword" required>
                    <button type="button" class="toggle-pass" data-target="loginPassword">👁</button>
                </div>
                <span class="error" data-error="loginPassword"></span>
            </div>

            <button type="submit" class="btn-primary">Войти</button>
            <p class="form-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        </form>
    </main>

    <script src="../scripts/main.js"></script>
</body>

</html>
